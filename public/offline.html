<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGFN — Hors connexion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      padding: 1.5rem;
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .logo {
      width: 56px;
      height: 56px;
      background: #0D3B66;
      border-radius: 1rem;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img { width: 40px; height: 40px; object-fit: contain; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #0D3B66; margin-bottom: .5rem; }
    p  { font-size: .9rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #0D3B66;
      color: white;
      border: none;
      border-radius: .75rem;
      padding: .75rem 1.5rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1E6091; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo-officiel.png" alt="SGFN" />
    </div>
    <h1>SGFN hors connexion</h1>
    <p>
      Vous n'êtes pas connecté à Internet.<br />
      Certaines données peuvent être disponibles hors ligne.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
