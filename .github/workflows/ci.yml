name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verifier:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p .

      # Zéro erreur exigé (dette apurée le 12/07/2026) ; les warnings restent tolérés.
      - name: Lint
        run: pnpm exec eslint src

      # Le build a besoin des variables publiques Supabase ; l'URL et la clé anon
      # sont publiques par design (exposées dans le bundle du site).
      - name: Build (export statique)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://bvdzrhvbiglwrhzpmuwy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build
